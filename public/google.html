<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /></head>
<body>
<script>
  // Google은 id_token을 URL 해시(#)에 담아 전달함
  var hash = window.location.hash.substring(1);
  var params = new URLSearchParams(hash);
  var idToken = params.get('id_token');
  if (idToken) {
    window.location.replace('sheriffapp://oauth-google?id_token=' + encodeURIComponent(idToken));
  }
</script>
</body>
</html>
